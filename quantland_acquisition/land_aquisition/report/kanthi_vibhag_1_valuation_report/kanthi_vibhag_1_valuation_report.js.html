<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <title>Kanthi Vibhag 1 Valuation Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10mm;
            font-size: 12pt;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            page-break-inside: auto;
        }
        th, td {
            border: 1px solid #333;
            padding: 6px 8px;
            text-align: left;
        }
        th {
            background-color: #f0f0f0;
        }
        tr {
            page-break-inside: avoid;
            page-break-after: auto;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center;">कंठी विभाग १ मूल्यांकन अहवाल</h1>

    <table>
        <thead>
            <tr>
                {% for col in columns %}
                    <th>{{ col.label }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
                <tr>
                    {% for value in row %}
                        <td>{{ value }}</td>
                    {% endfor %}
                </tr>
            {% else %}
                <tr>
                    <td colspan="{{ columns|length }}" style="text-align: center;">डेटा उपलब्ध नाही</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
